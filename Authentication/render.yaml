services:
  - type: web
    name: auth-service
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: auth-redis
          type: redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromService:
          name: auth-redis
          type: redis
          property: password
      - key: REDIS_DB
        value: 0
    healthCheckPath: /health
    autoDeploy: true 