      - GOOGLE_CLIENT_SECRET=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
      - GITHUB_CLIENT_ID=Ov23liylfwydkt30CJlW
      - GITHUB_CLIENT_SECRET=4cb2f8ac317b086531c1866148b4c6912fe1cfe4
      - ACCESS_TOKEN_EXPIRY=1hr
      - ACCESS_TOKEN_SECRET=divsync
