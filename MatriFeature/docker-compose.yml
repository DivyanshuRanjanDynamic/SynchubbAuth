version: '3.8'

services:
  matrifeature-service:
    build: .
    container_name: matrifeature-service
    ports:
      - "7001:7001"
    environment:
      - NODE_ENV=development
      - PORT=7001
      - MONGODB_URI=mongodb://mongodb:27017/matrifeature
      - AUTH_SERVICE_URL=http://auth-service:7001
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/api/v1/matri/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:latest
    container_name: matrifeature-mongodb
    ports:
      - "27018:27017"
    volumes:
      - matrifeature-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  matrifeature-mongodb-data: 