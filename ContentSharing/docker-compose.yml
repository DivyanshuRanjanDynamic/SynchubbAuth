version: '3.8'

services:
  content-service:
    build: .
    container_name: content-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=development
      - PORT=8001
      - MONGO_URI=mongodb://content-mongodb:27017/contentDB
      - REDIS_URL=redis://:devpassword@content-redis:6379
      - REDIS_PASSWORD=devpassword
      - ACCESS_TOKEN_SECRET=devsecret
      - ACCESS_TOKEN_EXPIRY=1hr
      - CLOUDINARY_CLOUD_NAME=devcloud
      - CLOUDINARY_API_KEY=devkey
      - CLOUDINARY_API_SECRET=devsecret
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - content-mongodb
      - content-redis
    networks:
      - content-network

  content-mongodb:
    image: mongo:latest
    container_name: content-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - content-mongodb-data:/data/db
    networks:
      - content-network

  content-redis:
    image: redis:alpine
    container_name: content-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass devpassword
    volumes:
      - content-redis-data:/data
    networks:
      - content-network

networks:
  content-network:
    driver: bridge

volumes:
  content-mongodb-data:
  content-redis-data: 